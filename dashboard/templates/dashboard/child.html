{% extends 'dashboard/base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto w-full">
    <div class="glass-panel p-10 text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-400 to-teal-500"></div>
        <h2 class="text-3xl font-bold text-emerald-300 mb-2">Connected to Parent</h2>
        <p class="text-gray-400 mb-8">Dad's Family Account</p>
        
        <div class="text-left space-y-4 max-w-xl mx-auto bg-slate-800/50 p-6 rounded-2xl mb-8">
            <h4 class="font-semibold text-xl mb-4 border-b border-slate-700 pb-2">Active Permissions</h4>
            
            <div class="flex justify-between items-center py-2">
                <span class="text-gray-300">Device Connection</span>
                <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 rounded-full text-sm">Approved</span>
            </div>
            <div class="flex justify-between items-center py-2">
                <span class="text-gray-300">File Sharing</span>
                <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 rounded-full text-sm">Approved</span>
            </div>
            <div class="flex justify-between items-center py-2">
                <span class="text-gray-300">Screen Sharing</span>
                <span class="px-3 py-1 bg-slate-700 text-gray-400 rounded-full text-sm">Revoked</span>
            </div>
        </div>

        <div class="flex justify-center gap-4">
            <button class="px-6 py-3 glass-panel hover:bg-white/10 transition font-semibold">Manage Files</button>
            <button class="px-6 py-3 bg-red-500/20 text-red-400 hover:bg-red-500/40 rounded-xl transition font-semibold">Disconnect Device</button>
        </div>
    </div>
</div>
{% endblock %}
