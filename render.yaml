services:
  - type: web
    name: family-connect-web
    env: python
    buildCommand: "./build.sh"
    startCommand: "uvicorn family_management.asgi:application --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
